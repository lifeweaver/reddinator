apply plugin: 'com.android.application'

android {
    namespace 'au.com.wallaceit.reddinator'
    compileSdk 33
    defaultConfig {
        applicationId 'au.com.wallaceit.reddinator'
        minSdkVersion 33
        targetSdkVersion 33
        vectorDrawables.useSupportLibrary = true
    }
    // No signingConfigs block: AGP signs debug builds with ~/.android/debug.keystore
    // (same alias/passwords you had hardcoded) on any machine, automatically.
    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:support-vector-drawable:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'org.apache.commons:commons-lang3:3.9'
    implementation 'com.joanzapata.android:android-iconify:1.0.11'
    implementation 'com.larswerkman:HoloColorPicker:1.5'
    implementation 'de.cketti.library.changelog:ckchangelog:1.2.2'
    implementation 'com.sothree.slidinguppanel:library:3.4.0'
    implementation 'com.github.guardian:Option:-SNAPSHOT' // TODO: pin to a commit hash or vendor
    implementation 'net.rdrei.android.dirchooser:library:3.2@aar'
}