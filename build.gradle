buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()          // Android support libs, AGP (replaces maven.google.com)
        mavenCentral()    // replaces jcenter()
        maven {
            url 'https://jitpack.io'
            content {     // only consult JitPack for the groups that need it
                includeGroup 'com.github.guardian'
            }
        }
    }
}